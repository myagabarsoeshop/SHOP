<!-- cashbook-frontend/views/stock_report.html -->
<div class="h-full w-full flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
    
    <!-- Top Filter Bar -->
    <div class="p-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 shrink-0 bg-slate-50/50 dark:bg-slate-950/50">
        <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
            
            <!-- Search Input -->
            <div class="relative shrink-0" style="width: calc((100% - 48px) / 4); min-width: 260px;">
                <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                <input type="text" id="sr-search" placeholder="ပစ္စည်းအမည် / Barcode / SKU ရှာရန်..."
                    class="w-full pl-9 pr-4 py-2 text-xs font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-900 dark:text-white transition shadow-sm">
            </div>

            <!-- Branch Selector -->
            <div class="relative w-48 shrink-0">
                <i class="fa-solid fa-store text-emerald-500 text-xs absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <select id="sr-branch-select" class="w-full pl-8 pr-7 py-2 text-xs font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 cursor-pointer appearance-none shadow-sm">
                    <!-- Populated dynamically -->
                </select>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>

            <!-- Category Selector -->
            <div class="relative w-44 shrink-0">
                <i class="fa-solid fa-layer-group text-blue-500 text-xs absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <select id="sr-category-select" class="w-full pl-8 pr-7 py-2 text-xs font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 cursor-pointer appearance-none shadow-sm">
                    <option value="">All Categories</option>
                </select>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>

            <!-- Year Selector -->
            <div class="relative w-36 shrink-0">
                <i class="fa-regular fa-calendar text-purple-500 text-xs absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <select id="sr-year-select" class="w-full pl-8 pr-7 py-2 text-xs font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 cursor-pointer appearance-none shadow-sm">
                    <!-- e.g. 2025, 2026, 2027 -->
                </select>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
        </div>

        <!-- Export CSV Button -->
        <button type="button" id="btn-export-sr-csv" title="စတော့အစီရင်ခံစာကို CSV ဖြင့် ထုတ်ယူမည်" class="px-3.5 py-2 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5 cursor-pointer shadow-sm active:scale-95">
            <i class="fa-solid fa-file-export text-emerald-500 text-xs"></i>
            <span class="hidden sm:inline">Export CSV</span>
        </button>
    </div>

    <!-- Matrix Report Table (Flat One-Line Design - No Background Colors) -->
    <div class="flex-1 overflow-x-auto overflow-y-auto relative">
        <table class="w-full text-left border-collapse min-w-[1700px]">
            <thead class="bg-slate-100/90 dark:bg-slate-800/90 text-slate-700 dark:text-slate-200 font-black text-xs uppercase tracking-wider sticky top-0 z-20 border-b-2 border-slate-300 dark:border-slate-700 backdrop-blur-sm whitespace-nowrap">
                <tr id="sr-table-header" class="h-11">
                    <th class="py-2.5 px-3 w-14 text-center">NO</th>
                    <th class="py-2.5 px-3 w-28 text-left">BARCODE</th>
                    <th class="py-2.5 px-4 w-32 text-left">CATEGORY</th>
                    <th class="py-2.5 px-4 w-56 text-left">ITEM NAME</th>
                    
                    <!-- 12 Months Columns -->
                    <th class="py-2.5 px-3 text-center">JAN</th>
                    <th class="py-2.5 px-3 text-center">FEB</th>
                    <th class="py-2.5 px-3 text-center">MAR</th>
                    <th class="py-2.5 px-3 text-center">APR</th>
                    <th class="py-2.5 px-3 text-center">MAY</th>
                    <th class="py-2.5 px-3 text-center">JUN</th>
                    <th class="py-2.5 px-3 text-center">JUL</th>
                    <th class="py-2.5 px-3 text-center">AUG</th>
                    <th class="py-2.5 px-3 text-center">SEP</th>
                    <th class="py-2.5 px-3 text-center">OCT</th>
                    <th class="py-2.5 px-3 text-center">NOV</th>
                    <th class="py-2.5 px-3 text-center">DEC</th>
                    
                    <!-- Totals and Valuation -->
                    <th class="py-2.5 px-4 text-right">TOTAL IN</th>
                    <th class="py-2.5 px-4 text-right">TOTAL OUT</th>
                    <th class="py-2.5 px-4 text-right">BALANCE</th>
                    <th class="py-2.5 px-4 text-right">STOCK VALUE</th>
                </tr>
            </thead>
            
            <tbody id="sr-table-body">
                <tr>
                    <td colspan="20" class="p-16 text-center text-slate-400">
                        <i class="fa-solid fa-chart-column fa-spin text-2xl mb-3 text-emerald-500"></i>
                        <div class="font-bold text-xs">အစီရင်ခံစာ အချက်အလက်များ ဆွဲယူနေပါသည်...</div>
                    </td>
                </tr>
            </tbody>
            
            <!-- Sticky Dynamic Footer Row -->
            <tfoot id="sr-table-foot" class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-white font-extrabold sticky bottom-0 z-20 border-t-2 border-slate-300 dark:border-slate-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                <!-- Populated dynamically by JavaScript -->
            </tfoot>
        </table>
    </div>

    <!-- Pagination Footer Container -->
    <div id="stock-report-pagination" class="shrink-0 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50"></div>
</div>
