  <!-- 💡 Real-Time Network & Dynamic FY 2026 Clock Engine -->
  <script>
    // ၁။ Wifi Status Tracker (Icon Only - Symmetrical)
    function updateNetworkStatus() {
      const netStatus = document.getElementById('network-status');
      const netIcon = document.getElementById('network-icon');

      if (!netStatus || !netIcon) return;

      if (navigator.onLine) {
        netStatus.className = 'flex items-center justify-center text-emerald-400 transition-colors duration-300 cursor-pointer';
        netStatus.title = 'Internet Connected (Online)';
        netIcon.className = 'fa-solid fa-wifi text-[11px]';
      } else {
        netStatus.className = 'flex items-center justify-center text-rose-400 transition-colors duration-300 cursor-pointer animate-pulse';
        netStatus.title = 'No Internet Connection (Offline)';
        netIcon.className = 'fa-solid fa-triangle-exclamation text-[11px]';
      }
    }

    // ၂။ Dynamic FY 2026 + Clock Updater (Auto-calculated, Never Hardcoded)
    function renderLiveHeaderMetadata() {
      const metaEl = document.getElementById('live-metadata');
      if (!metaEl) return;

      const now = new Date();
      // 💡 လက်ရှိနှစ်ကို System မှ Auto ယူတွက်သည် (၂၀၂၇ ရောက်ပါက အလိုအလျောက် FY 2027 ဖြစ်သွားမည်)
      const currentYear = now.getFullYear(); 
      const fyLabel = window.FY ? window.FY.getCurrentFY() : `FY ${currentYear}`;

      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dayName = days[now.getDay()];

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const formattedHours = String(hours).padStart(2, '0');
      const timeStr = `${formattedHours}:${minutes} ${ampm}`;

      let userName = 'Admin';
      try {
        const storedUser = localStorage.getItem('golden_user');
        if (storedUser) {
          const parsed = JSON.parse(storedUser);
          userName = parsed.name || parsed.username || 'Admin';
        }
      } catch (e) {}

      metaEl.textContent = `${fyLabel} | ${dayName} | ${timeStr} | User: ${userName}`;
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    document.addEventListener('DOMContentLoaded', () => {
      updateNetworkStatus();
      renderLiveHeaderMetadata();
      // စက္ကန့်တိုင်း အချိန်နှင့် FY ကို Auto စစ်ဆေးမွမ်းမံပေးသည်
      setInterval(renderLiveHeaderMetadata, 1000);
    });

    updateNetworkStatus();
    renderLiveHeaderMetadata();
  </script>

  <!-- 💡 Service Worker Registration with Auto-Update Check -->
  <script>
    if ('serviceWorker' in navigator) {

        navigator.serviceWorker.register('./sw.js')

            console.log('✅ ServiceWorker Registered Successfully:', reg.scope);
            if (reg && typeof reg.update === 'function') {
              reg.update();
            }
          })
          .catch(function (err) {
            console.warn('ServiceWorker Registration Error:', err);
          });
      });
    }
