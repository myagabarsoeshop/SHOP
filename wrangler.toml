# ==============================================================================
# MYA GABAR SOE SILK HOUSE (မြကမ္ဘာစိုး ပိုးထည်တိုက်) — WORKER CONFIGURATION
# Worker Name: shop
# Version: 4.1.0
# File: wrangler.toml
# ==============================================================================

name = "shop"
main = "cashbook-api/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 💡 1. FRONTEND STATIC ASSETS BINDING
[assets]
directory = "cashbook-frontend"
binding = "ASSETS"

# 💡 2. CLOUDFLARE D1 DATABASE BINDING (ACTIVE DB)
[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "c80bef7e-d6ce-4846-8a8e-f5b6902e563e"
migrations_dir = "cashbook-api/schema"

# 💡 3. PRODUCTION ENVIRONMENT VARIABLES
[vars]
ENVIRONMENT = "production"
APP_VERSION = "4.1.0"
ALLOWED_ORIGIN = "https://shop.myagabarsoeshop.workers.dev"
ADMIN_EMAIL = "myagabarsoeshop@gmail.com"

# 💡 4. AUTOMATED CRON TRIGGERS
[triggers]
crons = ["30 17 * * *"]
