<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အထည်ဆိုင် POS & စာရင်းကိုင်စနစ်</title>
    <!-- Tailwind CSS & FontAwesome -->
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans select-none overflow-hidden">

    <!-- Login Container (Login မဝင်ရသေးပါက ဤနေရာတွင် ပေါ်မည်) -->
    <div id="login-container" class="hidden"></div>

    <!-- Main App Layout (Login ဝင်ပြီးမှ ပေါ်မည်) -->
    <div id="app-layout" class="hidden flex h-screen w-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0 shadow-xl z-20">
            <div>
                <!-- Brand Header -->
                <div class="h-16 flex items-center gap-3 px-6 bg-slate-950 border-b border-slate-800/80">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                        <i class="fa-solid fa-shirt text-sm"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white tracking-wide">GARMENT ERP</div>
                        <div class="text-[10px] text-emerald-400 font-medium">POS + Cashbook</div>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1 text-xs font-medium">
                    <button data-view="pos" class="nav-item active flex items-center gap-3 w-full px-3.5 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800 hover:text-white">
                        <i class="fa-solid fa-cash-register w-5 text-center text-sm"></i>
                        <span>အရောင်းကောင်တာ (POS)</span>
                    </button>
                    <button data-view="cashbook" class="nav-item flex items-center gap-3 w-full px-3.5 py-3 rounded-xl transition text-slate-400 hover:bg-slate-800 hover:text-white">
                        <i class="fa-solid fa-book-journal-whills w-5 text-center text-sm"></i>
                        <span>နေ့စဉ်ငွေစာရင်း (Cashbook)</span>
                    </button>
                    <button data-view="inventory" class="nav-item flex items-center gap-3 w-full px-3.5 py-3 rounded-xl transition text-slate-400 hover:bg-slate-800 hover:text-white">
                        <i class="fa-solid fa-boxes-stacked w-5 text-center text-sm"></i>
                        <span>အထည်လက်ကျန် (Stock)</span>
                    </button>
                    <button data-view="yarn" class="nav-item flex items-center gap-3 w-full px-3.5 py-3 rounded-xl transition text-slate-400 hover:bg-slate-800 hover:text-white">
                        <i class="fa-solid fa-scroll w-5 text-center text-sm"></i>
                        <span>ချည်စတိုနှင့် ရက်ကန်း</span>
                    </button>
                    <button data-view="customers" class="nav-item flex items-center gap-3 w-full px-3.5 py-3 rounded-xl transition text-slate-400 hover:bg-slate-800 hover:text-white">
                        <i class="fa-solid fa-users w-5 text-center text-sm"></i>
                        <span>ဖောက်သည်နှင့် အကြွေးစာရင်း</span>
                    </button>
                </nav>
            </div>

            <!-- User Info & Logout -->
            <div class="p-4 border-t border-slate-800/80 bg-slate-950/50">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-lg bg-emerald-600/20 text-emerald-400 flex items-center justify-center font-bold text-xs shrink-0">
                            <span id="user-initial">U</span>
                        </div>
                        <div class="truncate">
                            <div id="user-name" class="text-xs font-semibold text-white truncate">User</div>
                            <div id="user-role" class="text-[10px] text-slate-400 capitalize truncate">Role</div>
                        </div>
                    </div>
                    <button id="btn-logout" title="စနစ်မှ ထွက်မည်" class="text-slate-400 hover:text-rose-400 p-2 rounded-lg transition">
                        <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Topbar Header -->
            <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0 shadow-sm z-10">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-medium text-slate-500">တာဝန်ကျရာ ဆိုင်ခွဲ:</span>
                        <!-- Branch Selector Dropdown (Admin အတွက် ဆိုင်အားလုံး ရွေးချယ်နိုင်သည်) -->
                        <div class="relative">
                            <select id="global-branch-select" class="text-xs font-bold text-slate-800 bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 cursor-pointer">
                                <!-- Options will be loaded dynamically -->
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Clock & Status Indicator -->
                <div class="flex items-center gap-4 text-xs">
                    <div class="flex items-center gap-2 text-slate-500 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200/60">
                        <i class="fa-regular fa-clock text-emerald-600"></i>
                        <span id="live-clock" class="font-mono">--:--:--</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-emerald-700 bg-emerald-50 px-2.5 py-1.5 rounded-lg font-medium border border-emerald-200/60">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>D1 Online</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container (POS, Cashbook စသည့် စာမျက်နှာများ ဤနေရာတွင် ပေါ်မည်) -->
            <main id="view-container" class="flex-1 bg-slate-100 overflow-hidden relative"></main>
        </div>
    </div>

    <!-- Modals Container (ဘောင်ချာ Print ထုတ်ခြင်းနှင့် ငွေရှင်း Modal များအတွက်) -->
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
