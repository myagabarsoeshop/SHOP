<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Emerald & Midnight Background -->
    <linearGradient id="bgLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- 24K Metallic Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Vibrant Emerald Gem Gradient -->
    <linearGradient id="emeraldGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Outer Squircle Base -->
  <rect width="120" height="120" rx="28" fill="url(#bgLuxury)"/>

  <!-- 2. Outer Gold Rim & Inner Emerald Hairline -->
  <rect x="3" y="3" width="114" height="114" rx="25" fill="none" stroke="url(#goldLuxury)" stroke-width="2.5"/>
  <rect x="7" y="7" width="106" height="106" rx="21" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 3. Decorative Octagon Emerald Gem Frame (မြကျောက်မျက်ဘောင်) -->
  <polygon points="60,12 94,26 108,60 94,94 60,108 26,94 12,60 26,26" 
           fill="url(#emeraldGem)" fill-opacity="0.12" 
           stroke="url(#goldLuxury)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- 4. Center Radial Ambient Light -->
  <circle cx="60" cy="60" r="36" fill="#10b981" fill-opacity="0.18"/>

  <!-- 5. Top Golden Crown / Silk Diamond Star Accent -->
  <path d="M60 15 L64 23 L72 23 L66 28 L68 35 L60 30 L52 35 L54 28 L48 23 L56 23 Z" 
        fill="url(#goldLuxury)" opacity="0.9"/>

  <!-- 6. Bottom Flowing Silk Ribbon Wave (ပိုးထည်လှိုင်း) -->
  <path d="M28 92 Q60 104 92 92" fill="none" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 97 Q60 105 82 97" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 7. Centerpiece "မြ" Typography with 3D Shadow -->
  <text x="60" y="65"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Padauk', 'Pyidaungsu', 'Myanmar Text', sans-serif"
        font-size="52"
        font-weight="700"
        fill="url(#goldLuxury)"
        stroke="#fef08a"
        stroke-width="0.6"
        filter="url(#glowShadow)">မြ</text>
</svg>
