
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 120"
     width="100%" height="100%">

  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120"
        rx="26" fill="url(#emerald)"/>

  <!-- Thin Gold Border -->
  <rect x="5" y="5"
        width="110" height="110"
        rx="22"
        fill="none"
        stroke="#c9a85c"
        stroke-width="1.3"/>

  <!-- Main Letter -->
  <text x="60" y="62"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Padauk', 'Pyidaungsu', 'Myanmar Text', sans-serif"
        font-size="58"
        font-weight="600"
        fill="#e8d19a">မြ</text>

</svg>
