<!-- cashbook-frontend/views/waste.html -->
<div class="h-full w-full flex flex-col bg-white dark:bg-slate-800/90 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm overflow-hidden">
    
    <!-- Top Action Toolbar -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-700/70 flex flex-wrap items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-3">
            <h2 class="text-lg font-bold text-slate-800 dark:text-white">ပျက်စီး / အလေအလွင့် မှတ်တမ်း</h2>
            <div class="px-3 py-1 bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-bold rounded-lg border border-amber-500/20">
                Damage & Waste Logs
            </div>
        </div>

        <div class="flex items-center gap-2.5">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
                <input type="text" id="waste-search" placeholder="ကုတ် / အမည် / အကြောင်းပြချက် ရှာရန်..." 
                    class="pl-9 pr-3.5 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-64 transition">
            </div>

            <button type="button" id="btn-export-waste-csv" class="px-4 py-2 bg-slate-100 dark:bg-slate-700/80 hover:bg-emerald-600 hover:text-white text-slate-700 dark:text-slate-200 font-bold text-sm rounded-xl transition flex items-center gap-2 cursor-pointer shadow-sm border border-slate-200 dark:border-slate-600">
                <i class="fa-solid fa-file-csv text-emerald-500"></i>
                <span>Export CSV</span>
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="flex-1 overflow-x-auto overflow-y-auto">
        <table class="w-full text-left text-sm whitespace-nowrap min-w-[1100px]">
            <thead class="bg-slate-50 dark:bg-slate-900 text-slate-600 dark:text-slate-300 font-bold sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                <tr>
                    <th class="p-4">ရက်စွဲ / Ref No</th>
                    <th class="p-4">ကုတ် / Barcode</th>
                    <th class="p-4">အမျိုးအစား</th>
                    <th class="p-4">အထည်အမည် / အဆင်</th>
                    <th class="p-4">အရောင် / ဆိုဒ်</th>
                    <th class="p-4 text-center">ပျက်စီးအရေအတွက်</th>
                    <th class="p-4 text-right">အရင်းဈေး</th>
                    <th class="p-4 text-right">ဆုံးရှုံးမှုတန်ဖိုး</th>
                    <th class="p-4">အကြောင်းပြချက်</th>
                    <th class="p-4 text-center">မှတ်တမ်းတင်သူ</th>
                    <th class="p-4 text-center">လုပ်ဆောင်ချက်</th>
                </tr>
            </thead>
            <tbody id="waste-table-body" class="divide-y divide-slate-200/60 dark:divide-slate-700/60 font-semibold text-slate-800 dark:text-slate-200">
                <tr>
                    <td colspan="11" class="p-12 text-center text-slate-400 text-base">မှတ်တမ်းများ ဆွဲယူနေပါသည်...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Edit Waste Modal (Admin Only) -->
<div id="waste-edit-modal" class="hidden fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 flex flex-col">
        <div class="p-5 bg-amber-600 text-white flex items-center justify-between shrink-0">
            <div class="text-base font-bold flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>ပျက်စီးစာရင်း ပြင်ဆင်မည်</span>
            </div>
            <button type="button" id="btn-close-waste-edit-modal" class="text-white/80 hover:text-white text-lg cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="waste-edit-form" class="p-6 space-y-4">
            <input type="hidden" id="edit-waste-id">
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">ပစ္စည်းအမည်</label>
                <input type="text" id="edit-waste-name" readonly class="w-full text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-slate-500 cursor-not-allowed">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">ပျက်စီး အရေအတွက် *</label>
                <input type="number" id="edit-waste-qty" min="1" required class="w-full text-sm font-bold font-mono bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-3.5 py-2 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အကြောင်းပြချက်</label>
                <input type="text" id="edit-waste-reason" class="w-full text-sm font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-3.5 py-2 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div class="pt-2">
                <button type="submit" id="btn-save-waste-edit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm rounded-xl shadow-lg transition cursor-pointer">
                    ပြင်ဆင်ချက် သိမ်းဆည်းမည်
                </button>
            </div>
        </form>
    </div>
</div>
