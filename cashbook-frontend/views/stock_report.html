<!-- cashbook-frontend/views/stock_report.html -->
<div class="h-full w-full flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
    
    <!-- Top Filter Bar (Matches Standard Module Toolbar Height) -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 shrink-0">
        <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
            <!-- Search Input -->
            <div class="relative flex-1 max-w-xs min-w-[200px]">
                <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400 text-sm pointer-events-none"></i>
                <input type="text" id="sr-search" placeholder="ပစ္စည်းအမည် / SKU ရှာရန်..."
                    class="w-full pl-10 pr-4 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-900 dark:text-white">
            </div>

            <!-- Branch Selector -->
            <div class="relative w-48">
                <i class="fa-solid fa-store text-emerald-500 text-sm absolute left-3.5 top-3 pointer-events-none"></i>
                <select id="sr-branch-select" class="w-full pl-9 pr-8 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 cursor-pointer appearance-none">
                    <!-- Populated dynamically -->
                </select>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400 absolute right-3 top-3.5 pointer-events-none"></i>
            </div>

            <!-- Category Selector -->
            <div class="relative w-44">
                <i class="fa-solid fa-layer-group text-blue-500 text-sm absolute left-3.5 top-3 pointer-events-none"></i>
                <select id="sr-category-select" class="w-full pl-9 pr-8 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 cursor-pointer appearance-none">
                    <option value="">အမျိုးအစား အားလုံး</option>
                </select>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400 absolute right-3 top-3.5 pointer-events-none"></i>
            </div>

            <!-- Year Selector -->
            <div class="relative w-36">
                <i class="fa-regular fa-calendar text-purple-500 text-sm absolute left-3.5 top-3 pointer-events-none"></i>
                <select id="sr-year-select" class="w-full pl-9 pr-8 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 cursor-pointer appearance-none">
                    <!-- e.g. 2025, 2026, 2027 -->
                </select>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400 absolute right-3 top-3.5 pointer-events-none"></i>
            </div>
        </div>

        <!-- Export CSV Button -->
        <button type="button" id="btn-export-sr-csv" class="px-4 py-2.5 bg-slate-100 dark:bg-slate-950 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-800 dark:text-white font-bold text-sm rounded-xl transition flex items-center gap-2 cursor-pointer border border-slate-300 dark:border-slate-800">
            <i class="fa-solid fa-file-export text-emerald-500"></i>
            <span>Export CSV</span>
        </button>
    </div>

    <!-- Matrix Report Table (Scrollable with Freeze Header & Fixed Total Footer) -->
    <div class="flex-1 overflow-x-auto overflow-y-auto">
        <table class="w-full text-left text-sm whitespace-nowrap min-w-[1700px] border-collapse">
            <thead class="bg-slate-50 dark:bg-slate-950 text-slate-600 dark:text-slate-300 font-bold sticky top-0 z-20 border-b border-slate-200 dark:border-slate-800">
                <tr id="sr-table-header">
                    <th class="p-4 w-14 text-center">NO</th>
                    <th class="p-4 w-32">Category</th>
                    <th class="p-4 w-56">Item Name</th>
                    <!-- 12 Months Columns -->
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Jan</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Feb</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Mar</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Apr</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">May</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Jun</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Jul</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Aug</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Sep</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Oct</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Nov</th>
                    <th class="p-3 text-center bg-slate-100/70 dark:bg-slate-900/80">Dec</th>
                    <!-- Totals and Valuation -->
                    <th class="p-4 text-right bg-emerald-50/50 dark:bg-emerald-950/20 text-emerald-600 dark:text-emerald-400">စုစုပေါင်းအဝင်</th>
                    <th class="p-4 text-right bg-rose-50/50 dark:bg-rose-950/20 text-rose-600 dark:text-rose-400">စုစုပေါင်းအထွက်</th>
                    <th class="p-4 text-right bg-blue-50/50 dark:bg-blue-950/20 text-blue-600 dark:text-blue-400">လက်ရှိလက်ကျန်</th>
                    <th class="p-4 text-right bg-amber-50/50 dark:bg-amber-950/20 text-amber-600 dark:text-amber-400">စတော့တန်ဖိုး</th>
                </tr>
            </thead>
            <tbody id="sr-table-body" class="divide-y divide-slate-100 dark:divide-slate-800 font-semibold text-slate-800 dark:text-slate-200">
                <tr>
                    <td colspan="19" class="p-12 text-center text-slate-400 text-base">အစီရင်ခံစာ အချက်အလက်များ ဆွဲယူနေပါသည်...</td>
                </tr>
            </tbody>
            <!-- Sticky Summary Total Row -->
            <tfoot id="sr-table-footer" class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-white font-extrabold sticky bottom-0 z-20 border-t-2 border-slate-300 dark:border-slate-700 shadow-md">
                <tr>
                    <td colspan="3" class="p-4 text-center tracking-wide font-black uppercase text-xs text-slate-500 dark:text-slate-400">
                        Total Summary
                    </td>
                    <!-- 12 Months In/Out Placeholder -->
                    <td colspan="12" class="p-4 text-center text-xs text-slate-400 italic">
                        (Annual In / Out Flow)
                    </td>
                    <td id="sr-grand-in" class="p-4 text-right font-mono font-black text-emerald-600 dark:text-emerald-400 text-base">0</td>
                    <td id="sr-grand-out" class="p-4 text-right font-mono font-black text-rose-600 dark:text-rose-400 text-base">0</td>
                    <td id="sr-grand-stock" class="p-4 text-right font-mono font-black text-blue-600 dark:text-blue-400 text-base">0</td>
                    <td id="sr-grand-value" class="p-4 text-right font-mono font-black text-amber-600 dark:text-amber-400 text-base">0 Ks</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- 15-Rows Pagination Footer Container (Window/Table အောက်စွန်းနှင့် တစ်သားတည်း ကွက်တိကျစေရန်) -->
    <div id="stock-report-pagination" class="shrink-0"></div>
</div>
