<!-- cashbook-frontend/views/waste.html -->
<div class="h-full w-full flex flex-col bg-white dark:bg-slate-800/90 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm overflow-hidden">
    
    <!-- Top Action Toolbar (Search Box & Export CSV Included) -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-700/70 flex flex-wrap items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-3">
            <h2 class="text-lg font-bold text-slate-800 dark:text-white">ပျက်စီး / အလေအလွင့် မှတ်တမ်း</h2>
            <div class="px-3 py-1 bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-bold rounded-lg border border-amber-500/20">
                Damage & Waste Logs
            </div>
        </div>

        <div class="flex items-center gap-2.5">
            <!-- Search Box -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
                <input type="text" id="waste-search" placeholder="ကုတ် / အမည် / အကြောင်းပြချက် ရှာရန်..." 
                    class="pl-9 pr-3.5 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-64 transition">
            </div>

            <!-- Export CSV Button -->
            <button type="button" id="btn-export-waste-csv" class="px-4 py-2 bg-slate-100 dark:bg-slate-700/80 hover:bg-emerald-600 hover:text-white text-slate-700 dark:text-slate-200 font-bold text-sm rounded-xl transition flex items-center gap-2 cursor-pointer shadow-sm border border-slate-200 dark:border-slate-600">
                <i class="fa-solid fa-file-csv text-emerald-500"></i>
                <span>Export CSV</span>
            </button>
        </div>
    </div>

    <!-- Waste Logs Table (Stock Balances Standard Typography & Spacing) -->
    <div class="flex-1 overflow-x-auto overflow-y-auto">
        <table class="w-full text-left text-sm whitespace-nowrap min-w-[1100px]">
            <thead class="bg-slate-50 dark:bg-slate-900 text-slate-600 dark:text-slate-300 font-bold sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                <tr>
                    <th class="p-4">ရက်စွဲ / Ref No</th>
                    <th class="p-4">ကုတ် / Barcode</th>
                    <th class="p-4">အမျိုးအစား</th>
                    <th class="p-4">အထည်အမည် / အဆင်</th>
                    <th class="p-4">အရောင် / ဆိုဒ်</th>
                    <th class="p-4 text-center">ပျက်စီးအရေအတွက်</th>
                    <th class="p-4 text-right">အရင်းဈေး</th>
                    <th class="p-4 text-right">ဆုံးရှုံးမှုတန်ဖိုး</th>
                    <th class="p-4">အကြောင်းပြချက်</th>
                    <th class="p-4 text-center">မှတ်တမ်းတင်သူ</th>
                </tr>
            </thead>
            <tbody id="waste-table-body" class="divide-y divide-slate-200/60 dark:divide-slate-700/60 font-semibold text-slate-800 dark:text-slate-200">
                <tr>
                    <td colspan="10" class="p-12 text-center text-slate-400 text-base">မှတ်တမ်းများ ဆွဲယူနေပါသည်...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
