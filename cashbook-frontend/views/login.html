<!-- cashbook-frontend/views/login.html -->
<div class="min-h-screen w-full flex items-center justify-center bg-slate-950 px-4 py-8 relative overflow-hidden">
    <!-- Background Glow -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-teal-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Login Card Box -->
    <div class="w-full max-w-[460px] bg-slate-900 border border-slate-800 shadow-2xl rounded-3xl p-8 relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center mb-7 flex flex-col items-center">
            <!-- 1. Minimal Emerald Logo အသစ် (အင်္ကျီပုံနေရာတွင် အစားထိုးထားသည်) -->
            <div class="w-16 h-16 mb-4 rounded-2xl shadow-lg shadow-emerald-500/20 shrink-0 overflow-hidden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-full h-full">
                    <defs>
                        <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#064e3b"/>
                            <stop offset="100%" stop-color="#022c22"/>
                        </linearGradient>
                    </defs>
                    <rect width="120" height="120" rx="26" fill="url(#emerald)"/>
                    <rect x="5" y="5" width="110" height="110" rx="22" fill="none" stroke="#c9a85c" stroke-width="1.3"/>
                    <text x="60" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Padauk', 'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="58" font-weight="600" fill="#e8d19a">မြ</text>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-wide">မြကမ္ဘာစိုး ပိုးထည်တိုက်</h1>
            <p class="text-sm text-emerald-400/90 mt-1 font-bold">POS & Multi-Store Garment ERP</p>
        </div>

        <!-- Error Notification Alert -->
        <div id="login-error" class="hidden mb-5 p-4 bg-rose-500/15 border border-rose-500/30 text-rose-300 text-sm rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation shrink-0 text-rose-400 text-base"></i>
            <span id="login-error-text" class="leading-relaxed font-semibold">စကားဝှက် မှားယွင်းနေပါသည်</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">
            <!-- 2. User Dropdown Selection -->
            <div>
                <label for="login-user-select" class="block text-sm font-semibold text-slate-200 mb-2">အသုံးပြုသူ ရွေးချယ်ပါ (Select User)</label>
                <div class="relative text-slate-400 focus-within:text-emerald-500">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none transition-colors">
                        <i class="fa-solid fa-circle-user text-lg"></i>
                    </span>
                    
                    <!-- appearance-none ကိုသုံးထားပြီး ညာဘက်အစွန်ကို Arrow ကပ်ပေးထားသည် -->
                    <select id="login-user-select" required
                        class="w-full pl-12 pr-10 py-3.5 text-sm font-semibold bg-slate-800 border border-slate-700 text-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition cursor-pointer appearance-none">
                        <option value="" disabled selected>အသုံးပြုသူအမည် ရွေးချယ်ပါ</option>
                        <optgroup label="🏢 ဗဟိုစီမံခန့်ခွဲမှု (Head Office)" class="bg-slate-900 text-slate-400">
                            <option value="admin" class="text-white py-1">စနစ်ပိုင်ရှင် (Admin)</option>
                            <option value="finance" class="text-white py-1">စာရင်းကိုင်/စာရင်းစစ် (Finance)</option>
                        </optgroup>
                        <optgroup label="🏬 ဆိုင်ခွဲ ကောင်တာများ (Branch Cashiers)" class="bg-slate-900 text-slate-400">
                            <option value="cashier_main" class="text-white py-1">Main Home Shop (အိမ်ဆိုင်/စက်ရုံ)</option>
                            <option value="cashier_sh1" class="text-white py-1">Shop 1 (ဆိုင်ခွဲ ၁)</option>
                            <option value="cashier_sh2" class="text-white py-1">Shop 2 (ဆိုင်ခွဲ ၂)</option>
                            <option value="cashier_sh3" class="text-white py-1">Shop 3 (ဆိုင်ခွဲ ၃)</option>
                            <option value="cashier_sh4" class="text-white py-1">Shop 4 (ဆိုင်ခွဲ ၄)</option>
                        </optgroup>
                    </select>

                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none transition-colors">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </span>
                </div>
            </div>

            <!-- 3 & 4. Password Input (Dark Mode Professional Style) -->
            <div>
                <label for="login-password" class="block text-sm font-semibold text-slate-200 mb-2">စကားဝှက် (Password)</label>
                <div class="relative text-slate-400 focus-within:text-emerald-500">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none transition-colors">
                        <i class="fa-solid fa-lock text-base"></i>
                    </span>
                    
                    <!-- bg-slate-800 ကိုဆက်သုံးထားပြီး Auto-fill Yellow မဖြစ်စေရန် ပြင်ဆင်ထားသည် -->
<input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••"
    class="w-full pl-12 pr-12 py-3.5 text-sm bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition [&:-webkit-autofill]:[box-shadow:0_0_0px_1000px_#1e293b_inset] [&:-webkit-autofill]:[-webkit-text-fill-color:#ffffff]" />
                    <button type="button" id="toggle-password" title="စကားဝှက် ကြည့်ရန်/ဖျောက်ရန်" class="absolute inset-y-0 right-0 flex items-center pr-4 hover:text-slate-200 cursor-pointer transition-colors">
                        <i class="fa-regular fa-eye text-base" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-login-submit"
                class="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white text-base font-bold rounded-2xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2.5 mt-3 cursor-pointer">
                <span>စနစ်ထဲသို့ ဝင်ရောက်မည်</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>

        <!-- System Footer -->
        <div class="mt-8 pt-5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-500">
            <span>Version 2.1.0</span>
            <span class="flex items-center gap-2 text-emerald-400 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Cloudflare D1 Online
            </span>
        </div>
    </div>
</div>
