# ==============================================================================
# MYA GABAR SOE SHOP - CLOUDFLARE WORKER CONFIGURATION
# File: wrangler.toml  
# ==============================================================================

name = "shop"
main = "cashbook-api/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 💡 Frontend Static Assets Binding (ဤနေရာလေး လိုအပ်နေခြင်း ဖြစ်ပါသည်)
[assets]
directory = "cashbook-frontend"
binding = "ASSETS"

# 💡 1. CLOUDFLARE D1 DATABASE BINDING
[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "c80bef7e-d6ce-4846-8a8e-f5b6902e563e"

# 💡 2. ENVIRONMENT VARIABLES
[vars]
ALLOWED_ORIGIN = "https://shop.myagabarsoeshop.workers.dev"

# 💡 3. AUTOMATED CRON TRIGGERS
[triggers]
crons = ["0 0 * * *"]
