/* ============================================================
   MYA GABAR SOE SHOP - ENTERPRISE ERP DESIGN SYSTEM CSS
   ============================================================ */

/* 1. GLOBAL FONT, TABULAR NUMBERS & RESET */
* {
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Inter', 'Padauk', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Ensure active view flexes cleanly below ALL-branch Read-Only banner */
#view-container > div:not(#all-branch-readonly-banner) {
    flex: 1 1 0%;
    min-height: 0;
}

/* Tabular Numbers for Accounting & Stock Alignment */
.font-mono,
table td,
table th,
input[type="number"],
input[inputmode="numeric"] {
    font-variant-numeric: tabular-nums;
}

/* Clean Number Inputs (Remove ugly spinners on price inputs) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    opacity: 0.6;
}

/* 2. CUSTOM SCROLLBAR */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.35);
    border-radius: 6px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.55);
}

/* ============================================================
   3. DARK MODE - GLOBAL & CONTAINERS
   ============================================================ */
html.dark body {
    background-color: #0b0f19 !important;
    color: #e2e8f0;
    color-scheme: dark;
}

html.dark .bg-white:not(#receipt-print-area):not(.receipt-paper) {
    background-color: #151e32 !important;
    color: #e2e8f0;
    border-color: rgba(255, 255, 255, 0.1);
}

html.dark .bg-slate-900,
html.dark .bg-slate-950 {
    background-color: #151e32;
}

/* Keep aside sidebar and modal headers deep dark */
html.dark aside.bg-slate-950,
html.dark header.dark\:bg-slate-950 {
    background-color: #090d16 !important;
}

/* ============================================================
   4. TABLES & STICKY RIGHT ACTION COLUMN (NO BLEED-THROUGH)
   ============================================================ */
table {
    border-spacing: 0;
}

tbody tr {
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    transition: background-color 0.12s ease;
}

tbody tr:hover {
    background-color: #f8fafc;
}

/* Sticky Action Column in Light Mode */
thead th.sticky {
    background-color: #f1f5f9 !important;
}

tbody td.sticky {
    background-color: #ffffff !important;
    box-shadow: -4px 0 8px rgba(0, 0, 0, 0.04);
}

tbody tr:hover td.sticky {
    background-color: #f8fafc !important;
}

/* Dark Mode Table & Sticky Action Column */
html.dark table,
html.dark th,
html.dark td,
html.dark tbody tr {
    border-color: rgba(255, 255, 255, 0.09);
}

html.dark thead tr,
html.dark thead th.sticky {
    background-color: #1e293b !important;
    color: #f1f5f9;
}

html.dark tbody td.sticky {
    background-color: #151e32 !important;
    box-shadow: -4px 0 10px rgba(0, 0, 0, 0.25);
}

html.dark tbody tr:hover {
    background-color: rgba(30, 41, 59, 0.65);
}

html.dark tbody tr:hover td.sticky {
    background-color: #1c2841 !important;
}

html.dark .border,
html.dark [class*="border-slate-800"],
html.dark [class*="border-slate-700"] {
    border-color: rgba(255, 255, 255, 0.11);
}

html.dark [class*="divide-slate-800"] > :not(:last-child) {
    border-color: rgba(255, 255, 255, 0.09);
}

/* ============================================================
   5. DARK MODE - TYPOGRAPHY & INPUTS
   ============================================================ */
html.dark .text-slate-900 { color: #f8fafc; }
html.dark .text-slate-800 { color: #f1f5f9; }
html.dark .text-slate-700 { color: #cbd5e1; }
html.dark .text-slate-600 { color: #cbd5e1; }
html.dark .text-slate-500 { color: #94a3b8; }
html.dark .text-slate-400 { color: #94a3b8; }

html.dark input:not([readonly]),
html.dark select,
html.dark textarea {
    color: #f8fafc;
    border-color: rgba(255, 255, 255, 0.15);
}

html.dark input::placeholder,
html.dark textarea::placeholder {
    color: #64748b;
}

html.dark select option {
    background-color: #151e32;
    color: #f8fafc;
}

/* Thermal Receipt Paper Always White */
#receipt-print-area,
#receipt-print-area * {
    background-color: #ffffff !important;
    color: #000000 !important;
}

/* 6. CARD SHADOWS & POS HOVER */
html.dark .shadow,
html.dark .shadow-sm,
html.dark .shadow-md,
html.dark .shadow-lg {
    box-shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.45);
}

.product-card {

}

.product-card:active {
    transform: scale(0.98);
}

html.dark .product-card:hover {
    border-color: #10b981;
    box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.35);
}

/* 7. KEYBOARD ACCESSIBILITY */
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 2px solid #10b981;
    outline-offset: 1px;
}

/* ============================================================
   8. THERMAL RECEIPT (80MM) & STATEMENT PRINT ENGINE
   ============================================================ */
@media print {
    @page {
        size: 80mm auto;
        margin: 0;
    }

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
    }

    body * {
        visibility: hidden !important;
    }

    /* 80mm POS Receipt Print */
    #receipt-print-area,
    #receipt-print-area * {
        visibility: visible !important;
    }

    #receipt-print-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 80mm !important;
        box-sizing: border-box !important;
        margin: 0 !important;
        padding: 4mm !important;
        background: #ffffff !important;
        color: #000000 !important;
        border: none !important;
        box-shadow: none !important;
        overflow: visible !important;
    }

    /* Customer / Supplier Statement Print Support */
    #customer-ledger-modal:not(.hidden),
    #customer-ledger-modal:not(.hidden) * {
        visibility: visible !important;
        color: #000000 !important;
        background: #ffffff !important;
    }

        padding: 0 !important;
    }

    #global-confirm-dialog,
    #btn-export-ledger-csv,
    #btn-print-ledger,
    #btn-close-ledger-modal {
        display: none !important;
    }
}

                <div class="grid grid-cols-4 gap-4">
                    <!-- KPI Box 1 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-1-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-0.5">Today Sale (Cash)</div>
                            <div id="kpi-1-value" class="text-2xl font-black text-emerald-600 dark:text-emerald-400 font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-1-icon" class="fa-solid fa-money-bill-wave"></i>
                        </div>
                    </div>

                    <!-- KPI Box 2 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-2-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-0.5">Today Sale (Bank)</div>
                            <div id="kpi-2-value" class="text-2xl font-black text-blue-600 dark:text-blue-400 font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-2-icon" class="fa-solid fa-building-columns"></i>
                        </div>
                    </div>

                    <!-- KPI Box 3 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-3-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-0.5">Total Today Sale</div>
                            <div id="kpi-3-value" class="text-2xl font-black text-emerald-600 dark:text-emerald-400 font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-3-icon" class="fa-solid fa-cash-register"></i>
                        </div>
                    </div>

                    <!-- KPI Box 4 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-4-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-0.5">Total Sale Items</div>
                            <div id="kpi-4-value" class="text-2xl font-black text-slate-900 dark:text-white font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-4-icon" class="fa-solid fa-shirt"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. Dynamic View Workspace (Flex Column for Read-Only Banner + View Card) -->
            <main id="view-container" class="flex-1 flex flex-col overflow-hidden px-6 pt-2 pb-3.5 relative"></main>
        </div>
    </div>

    <!-- Main Entrypoint -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
