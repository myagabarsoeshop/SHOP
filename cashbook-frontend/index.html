<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မြကမ္ဘာစိုး ပိုးထည်တိုက် - POS & စာရင်းကိုင်စနစ်</title>

    <!-- Minimal Emerald "မြ" SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23064e3b'/%3E%3Crect x='5' y='5' width='110' height='110' rx='22' fill='none' stroke='%23c9a85c' stroke-width='1.5'/%3E%3Ctext x='60' y='62' text-anchor='middle' dominant-baseline='central' font-family='Padauk,Pyidaungsu,sans-serif' font-size='58' font-weight='600' fill='%23e8d19a'%3E%E1%80%99%E1%80%BC%3C/text%3E%3C/svg%3E" />

    <!-- Tailwind CSS (Official CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Padauk', 'sans-serif'],
                    },
                    spacing: {
                        '68': '17rem',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Inter & Padauk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        body {
            font-family: 'Inter', 'Padauk', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        /* Thermal Receipt Printer (80mm) Styles */
        @media print {
            @page {
                size: 80mm auto;
                margin: 0;
            }
            body * {
                visibility: hidden;
            }
            #receipt-print-area, #receipt-print-area * {
                visibility: visible;
            }
            #receipt-print-area {
                position: fixed;
                left: 0;
                top: 0;
                width: 80mm;
                padding: 4mm;
                background: #fff !important;
                color: #000 !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased select-none overflow-hidden h-screen w-screen">

    <!-- Global Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none no-print"></div>

    <!-- Login Container -->
    <div id="login-container" class="hidden min-h-screen w-full"></div>

    <!-- Main Unified App Layout -->
    <div id="app-layout" class="hidden flex h-screen w-screen overflow-hidden">
        
        <!-- Left Sidebar (English Labels & Clean Hierarchy) -->
        <aside class="w-68 bg-slate-950 text-slate-300 flex flex-col justify-between shrink-0 border-r border-slate-800/80 z-20">
            <div>
                <!-- Brand Logo & Shop Name -->
                <div class="h-16 flex items-center gap-3 px-5 border-b border-slate-800/80">
                    <!-- Minimal Emerald Brand Logo -->
                    <div class="w-11 h-11 rounded-xl shadow-lg shadow-emerald-500/20 shrink-0 overflow-hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-full h-full">
                            <defs>
                                <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#064e3b"/>
                                    <stop offset="100%" stop-color="#022c22"/>
                                </linearGradient>
                            </defs>
                            <rect width="120" height="120" rx="26" fill="url(#emerald)"/>
                            <rect x="5" y="5" width="110" height="110" rx="22" fill="none" stroke="#c9a85c" stroke-width="1.3"/>
                            <text x="60" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Padauk', 'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="58" font-weight="600" fill="#e8d19a">မြ</text>
                        </svg>
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-emerald-400 truncate">မြကမ္ဘာစိုး ပိုးထည်တိုက်</div>
                        <div class="text-sm font-extrabold text-white tracking-wide truncate">GARMENT ERP</div>
                    </div>
                </div>

                <!-- Navigation Menu (English Labels) -->
                <nav class="p-3.5 space-y-1.5 text-sm font-bold">
                    <button type="button" data-view="pos" class="nav-item active flex items-center gap-3.5 w-full px-4 py-3 rounded-xl transition bg-emerald-600 text-white shadow-md shadow-emerald-600/20 cursor-pointer">
                        <i class="fa-solid fa-cash-register w-5 text-center text-base"></i>
                        <span>Sale Counter</span>
                    </button>
                    <button type="button" data-view="cashbook" class="nav-item flex items-center gap-3.5 w-full px-4 py-3 rounded-xl transition text-slate-400 hover:bg-slate-900 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-book-journal-whills w-5 text-center text-base"></i>
                        <span>Cash Book</span>
                    </button>
                    <button type="button" data-view="inventory" class="nav-item flex items-center gap-3.5 w-full px-4 py-3 rounded-xl transition text-slate-400 hover:bg-slate-900 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-boxes-stacked w-5 text-center text-base"></i>
                        <span>Stock Balances</span>
                    </button>
                    <button type="button" data-view="yarn" class="nav-item flex items-center gap-3.5 w-full px-4 py-3 rounded-xl transition text-slate-400 hover:bg-slate-900 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-scroll w-5 text-center text-base"></i>
                        <span>Yarn Balances</span>
                    </button>
                    <button type="button" data-view="customers" class="nav-item flex items-center gap-3.5 w-full px-4 py-3 rounded-xl transition text-slate-400 hover:bg-slate-900 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-users w-5 text-center text-base"></i>
                        <span>Customers & Liabilities</span>
                    </button>
                </nav>
            </div>

            <!-- User Profile & Logout -->
            <div class="p-4 border-t border-slate-800/80 bg-slate-900/40">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-extrabold text-sm shrink-0">
                            <span id="user-initial">U</span>
                        </div>
                        <div class="truncate">
                            <div id="user-name" class="text-sm font-bold text-white truncate">User</div>
                            <div id="user-role" class="text-xs text-slate-400 capitalize truncate">Role</div>
                        </div>
                    </div>
                    <button type="button" id="btn-logout" title="စနစ်မှ ထွက်မည်" class="text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 p-2.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-power-off text-base"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Workspace Column -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-100 dark:bg-slate-900">
            
            <!-- 1. Topbar Header (Fixed 64px) -->
            <header class="h-16 bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800/80 px-6 flex items-center justify-between shrink-0 z-10">
                <!-- Left: Dynamic Page Title & Store Pill -->
                <div class="flex items-center gap-4">
                    <h2 id="topbar-page-title" class="text-lg font-extrabold text-slate-900 dark:text-white tracking-tight">
                        Sale Counter (POS)
                    </h2>

                    <div class="h-5 w-[1px] bg-slate-200 dark:bg-slate-800"></div>

                    <!-- Modern Store Selector Badge -->
                    <div class="relative inline-flex items-center">
                        <i class="fa-solid fa-store text-emerald-500 text-sm absolute left-3.5 pointer-events-none"></i>
                        <select id="global-branch-select" class="pl-9 pr-8 py-2 text-sm font-bold text-slate-800 dark:text-slate-100 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-emerald-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/30 cursor-pointer appearance-none transition">
                            <!-- Dynamically loaded -->
                        </select>
                        <i class="fa-solid fa-chevron-down text-xs text-slate-400 absolute right-3 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Right: Theme Switcher, Clock & D1 Status -->
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" type="button" title="Light / Dark Mode ပြောင်းရန်"
                        class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-800 flex items-center justify-center transition border border-slate-200 dark:border-slate-800 cursor-pointer">
                        <i class="fa-solid fa-sun text-base" id="theme-icon"></i>
                    </button>

                    <div class="flex items-center gap-2 text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800">
                        <i class="fa-regular fa-clock text-emerald-500 text-sm"></i>
                        <span id="live-clock" class="font-mono font-bold text-sm">--:--:--</span>
                    </div>

                    <div id="d1-status-badge" class="flex items-center gap-2 text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-3.5 py-2 rounded-xl font-bold border border-emerald-200 dark:border-emerald-800/60 text-xs">
                        <span id="d1-status-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="d1-status-text">D1 Online</span>
                    </div>
                </div>
            </header>

            <!-- 2. Updated 4-Box KPI Summary Bar (Requested Format) -->
            <section id="global-kpi-bar" class="px-6 pt-4 pb-2 shrink-0">
                <div class="grid grid-cols-4 gap-4">
                    <!-- KPI Box 1 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-1-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">Today Sale (Cash)</div>
                            <div id="kpi-1-value" class="text-2xl font-black text-emerald-600 dark:text-emerald-400 font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-1-icon" class="fa-solid fa-money-bill-wave"></i>
                        </div>
                    </div>

                    <!-- KPI Box 2 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-2-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">Today Sale (Bank)</div>
                            <div id="kpi-2-value" class="text-2xl font-black text-blue-600 dark:text-blue-400 font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-2-icon" class="fa-solid fa-building-columns"></i>
                        </div>
                    </div>

                    <!-- KPI Box 3 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-3-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">Total Today Sale</div>
                            <div id="kpi-3-value" class="text-2xl font-black text-emerald-600 dark:text-emerald-400 font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-3-icon" class="fa-solid fa-cash-register"></i>
                        </div>
                    </div>

                    <!-- KPI Box 4 -->
                    <div class="bg-white dark:bg-slate-800/90 px-5 py-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm flex items-center justify-between">
                        <div>
                            <div id="kpi-4-label" class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">Total Sale Items</div>
                            <div id="kpi-4-value" class="text-2xl font-black text-slate-900 dark:text-white font-mono tracking-tight">0</div>
                        </div>
                        <div class="w-11 h-11 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-lg shrink-0">
                            <i id="kpi-4-icon" class="fa-solid fa-shirt"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. Dynamic View Workspace -->
            <main id="view-container" class="flex-1 overflow-hidden px-6 pb-5 pt-2 relative"></main>
        </div>
    </div>

    <!-- Main Entrypoint -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
