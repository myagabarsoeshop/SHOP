<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Dark Navy/Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1b26"/>
      <stop offset="50%" stop-color="#08121d"/>
      <stop offset="100%" stop-color="#040911"/>
    </linearGradient>

    <!-- "မြ" Typography Gradient (Emerald Green to Warm Gold) -->
    <linearGradient id="myaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Luxury Gold-Emerald Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Border -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Inner Soft Radial Glow -->
  <circle cx="50" cy="50" r="30" fill="#10b981" fill-opacity="0.12"/>

  <!-- "မြ" Character Centerpiece -->
  <text x="50" y="63"
        text-anchor="middle"
        font-family="'Pyidaungsu', 'Myanmar Text', 'Noto Sans Myanmar', sans-serif"
        font-size="46"
        font-weight="900"
        fill="url(#myaGrad)">မြ</text>
</svg>
