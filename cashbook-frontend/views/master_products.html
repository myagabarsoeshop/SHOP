<!-- cashbook-frontend/views/master_products.html -->
<div class="h-full w-full flex flex-col bg-white dark:bg-slate-800/90 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm overflow-hidden">
    
    <!-- Top Filter & Action Toolbar -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-700/70 flex flex-wrap items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-3 flex-1 min-w-[280px]">
            <h2 class="text-lg font-bold text-slate-800 dark:text-white mr-4">Product Master (ဗဟိုစာရင်း)</h2>
            <div class="relative flex-1 max-w-md">
                <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400 text-sm pointer-events-none"></i>
                <input type="text" id="master-search" placeholder="ကုတ် / Barcode / အထည်အမည် / အဆင် ရှာဖွေရန်..."
                    class="w-full pl-10 pr-4 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-900 dark:text-white">
            </div>
        </div>

        <div class="flex items-center gap-2.5">
            <button type="button" id="btn-add-master-product" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl shadow-md shadow-blue-600/20 transition flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-plus-circle"></i>
                <span>ပစ္စည်းအမည်သစ် မှတ်ပုံတင်မည်</span>
            </button>
        </div>
    </div>

    <!-- Master Products Table -->
    <div class="flex-1 overflow-y-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-slate-50 dark:bg-slate-900 text-slate-600 dark:text-slate-300 font-bold sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                <tr>
                    <th class="p-4">ကုတ် / Barcode</th>
                    <th class="p-4">အမျိုးအစား</th>
                    <th class="p-4">အထည်အမည် / အဆင်</th>
                    <th class="p-4">အရောင် / ဆိုက်</th>
                    <th class="p-4 text-right">အရင်းဈေး</th>
                    <th class="p-4 text-right">လက်လီဈေး</th>
                    <th class="p-4 text-right">လက်ကားဈေး</th>
                    <th class="p-4 text-center">လုပ်ဆောင်ချက်</th>
                </tr>
            </thead>
            <tbody id="master-table-body" class="divide-y divide-slate-200/60 dark:divide-slate-700/60 font-semibold text-slate-800 dark:text-slate-200">
                <tr>
                    <td colspan="8" class="p-12 text-center text-slate-400 text-base">ဗဟိုကုန်ပစ္စည်းစာရင်း ဆွဲယူနေပါသည်...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add / Edit Master Product Modal -->
<div id="master-product-modal" class="hidden fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 flex flex-col max-h-[90vh]">
        <div class="p-5 bg-blue-600 text-white flex items-center justify-between shrink-0">
            <div class="text-base font-bold flex items-center gap-2">
                <i class="fa-solid fa-boxes-packing"></i>
                <span id="master-modal-title">ဗဟိုကုန်ပစ္စည်းအချက်အလက် သွင်းမည်</span>
            </div>
            <button type="button" id="btn-close-master-modal" class="text-white/80 hover:text-white text-lg cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="master-product-form" class="p-6 space-y-4 overflow-y-auto">
            <input type="hidden" id="master-prod-id" value="">

            <div class="grid grid-cols-2 gap-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အထည်ကုတ် (SKU)</label>
                    <input type="text" id="master-prod-sku" placeholder="ဥပမာ - PS-001" class="w-full text-sm font-mono font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Barcode နံပါတ်</label>
                    <input type="text" id="master-prod-barcode" placeholder="Scanner ဖတ်ရန်" class="w-full text-sm font-mono font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အမျိုးအစား (Category) *</label>
                    <input type="text" id="master-prod-category" required list="master-category-suggestions" placeholder="ပုဆိုး / လုံချည် / အင်္ကျီ" class="w-full text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                    <datalist id="master-category-suggestions">
                        <option value="ပုဆိုး"><option value="လုံချည်"><option value="အင်္ကျီ"><option value="ပိတ်စ"><option value="ပိုးထည်">
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အထည်အမည် (Item Name) *</label>
                    <input type="text" id="master-prod-name" required placeholder="ဥပမာ - ကချင်ပိုးထည်" class="w-full text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အဆင် / ဒီဇိုင်း</label>
                    <input type="text" id="master-prod-pattern" placeholder="အကွက်စိပ်" class="w-full text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အရောင် (Color)</label>
                    <input type="text" id="master-prod-color" placeholder="နက်ပြာ" class="w-full text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">ဆိုက် (Size)</label>
                    <input type="text" id="master-prod-size" value="Free Size" class="w-full text-sm font-bold bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
            </div>

            <div class="p-3 my-2 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800/50 rounded-xl">
                <p class="text-xs text-blue-700 dark:text-blue-400 font-bold"><i class="fa-solid fa-circle-info mr-1"></i> ဤနေရာတွင် ဈေးနှုန်းပြင်ဆင်ပါက ဆိုင်ခွဲအားလုံး၌ တစ်ပြိုင်နက် သက်ရောက်မည်ဖြစ်ပါသည်။</p>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">အရင်းဈေး</label>
                    <input type="number" id="master-prod-cost" required min="0" step="any" value="0" class="w-full text-sm font-mono font-black bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">လက်လီဈေး *</label>
                    <input type="number" id="master-prod-retail" required min="0" step="any" value="0" class="w-full text-sm font-mono font-black bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-emerald-600 dark:text-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">လက်ကားဈေး *</label>
                    <input type="number" id="master-prod-wholesale" required min="0" step="any" value="0" class="w-full text-sm font-mono font-black bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-blue-600 dark:text-blue-400">
                </div>
            </div>

            <button type="submit" id="btn-submit-master-product" class="w-full mt-4 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-base rounded-xl shadow-lg transition cursor-pointer">
                ဗဟိုစာရင်းသို့ သိမ်းဆည်းမည်
            </button>
        </form>
    </div>
</div>
