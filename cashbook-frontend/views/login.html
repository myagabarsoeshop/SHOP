<!-- cashbook-frontend/views/login.html -->
<div class="min-h-screen w-full flex items-center justify-center bg-slate-950 px-4 py-8 relative overflow-hidden">
    <!-- Background Glow -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-teal-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Login Card Box (Width ချဲ့ထားပြီး စာလုံးကြီးထားသည်) -->
    <div class="w-full max-w-[460px] bg-slate-900 border border-slate-800 shadow-2xl rounded-3xl p-8 relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 mb-3 shadow-inner">
                <i class="fa-solid fa-shirt text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">အထည်ဆိုင် POS & စာရင်းကိုင်</h1>
            <p class="text-sm text-slate-400 mt-1 font-medium">Multi-Store Enterprise System</p>
        </div>

        <!-- Error Notification Alert -->
        <div id="login-error" class="hidden mb-5 p-4 bg-rose-500/15 border border-rose-500/30 text-rose-300 text-sm rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation shrink-0 text-rose-400 text-base"></i>
            <span id="login-error-text" class="leading-relaxed">စကားဝှက် မှားယွင်းနေပါသည်</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">
            <!-- User Dropdown Selection -->
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">အသုံးပြုသူ ရွေးချယ်ပါ (Select User)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-emerald-400 pointer-events-none">
                        <i class="fa-solid fa-user-circle text-lg"></i>
                    </span>
                    <select id="login-user-select" required
                        class="w-full pl-12 pr-10 py-3.5 text-sm font-semibold bg-slate-800 border border-slate-700 text-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition cursor-pointer appearance-none">
                        <option value="" disabled selected>အသုံးပြုသူအမည် ရွေးချယ်ပါ ▼</option>
                        <optgroup label="🏢 ဗဟိုစီမံခန့်ခွဲမှု (Head Office)" class="bg-slate-900 text-slate-400">
                            <option value="admin" class="text-white py-1">စနစ်ပိုင်ရှင် (Admin)</option>
                            <option value="finance" class="text-white py-1">စာရင်းကိုင်/စာရင်းစစ် (Finance)</option>
                        </optgroup>
                        <optgroup label="🏬 ဆိုင်ခွဲ ကောင်တာများ (Branch Cashiers)" class="bg-slate-900 text-slate-400">
                            <option value="cashier_main" class="text-white py-1">Main Home Shop (အိမ်ဆိုင်/စက်ရုံ)</option>
                            <option value="cashier_sh1" class="text-white py-1">Shop 1 (ဆိုင်ခွဲ ၁)</option>
                            <option value="cashier_sh2" class="text-white py-1">Shop 2 (ဆိုင်ခွဲ ၂)</option>
                            <option value="cashier_sh3" class="text-white py-1">Shop 3 (ဆိုင်ခွဲ ၃)</option>
                            <option value="cashier_sh4" class="text-white py-1">Shop 4 (ဆိုင်ခွဲ ၄)</option>
                        </optgroup>
                    </select>
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </span>
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-200 mb-2">စကားဝှက် (Password)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-base"></i>
                    </span>
                    <input type="password" id="login-password" required placeholder="စကားဝှက် ရိုက်ထည့်ပါ"
                        class="w-full pl-12 pr-12 py-3.5 text-sm bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" />
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-slate-200">
                        <i class="fa-regular fa-eye text-base" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-login-submit"
                class="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white text-base font-bold rounded-2xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2.5 mt-3 cursor-pointer">
                <span>စနစ်ထဲသို့ ဝင်ရောက်မည်</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>

        <!-- System Footer -->
        <div class="mt-8 pt-5 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500">
            <span>Version 2.1.0</span>
            <span class="flex items-center gap-2 text-emerald-400 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Cloudflare D1 Online
            </span>
        </div>
    </div>
</div>
