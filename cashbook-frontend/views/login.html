<!-- cashbook-frontend/views/login.html -->
<div class="min-h-screen w-full flex items-center justify-center bg-[#090d16] px-4 py-8 relative overflow-hidden">
    <!-- Ambient Background Glow -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-teal-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Login Card Box -->
    <div class="w-full max-w-[440px] bg-[#151e32] border border-slate-800/90 shadow-2xl rounded-3xl p-7 sm:p-8 relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center mb-6 flex flex-col items-center">
            <div class="w-16 h-16 mb-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 shrink-0 overflow-hidden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-full h-full">
                    <defs>
                        <linearGradient id="login-emerald" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#064e3b"/>
                            <stop offset="100%" stop-color="#022c22"/>
                        </linearGradient>
                    </defs>
                    <rect width="120" height="120" rx="26" fill="url(#login-emerald)"/>
                    <rect x="5" y="5" width="110" height="110" rx="22" fill="none" stroke="#c9a85c" stroke-width="1.3"/>
                    <text x="60" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Padauk', 'Pyidaungsu', 'Myanmar Text', sans-serif" font-size="58" font-weight="600" fill="#e8d19a">မြ</text>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-wide">မြကမ္ဘာစိုး ပိုးထည်တိုက်</h1>
            <p class="text-xs text-emerald-400 mt-1 font-bold tracking-wide uppercase">POS & Multi-Store Garment ERP</p>
        </div>

        <!-- Error Notification Alert -->
        <div id="login-error" class="hidden mb-5 p-3.5 bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation shrink-0 text-rose-400 text-base"></i>
            <span id="login-error-text" class="leading-relaxed font-bold">စကားဝှက် မှားယွင်းနေပါသည်</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <!-- User Dropdown Selection -->
            <div>
                <label for="login-user-select" class="block text-xs font-bold text-slate-300 mb-1.5">အသုံးပြုသူ ရွေးချယ်ပါ (Select User)</label>
                <div class="relative text-slate-400 focus-within:text-emerald-400">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none transition-colors">
                        <i class="fa-solid fa-circle-user text-base"></i>
                    </span>
                    
                    <select id="login-user-select" required
                        class="w-full pl-11 pr-10 py-3 text-xs font-bold bg-[#0b0f19] border border-slate-700/80 text-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition cursor-pointer appearance-none">
                        <option value="" disabled selected>အသုံးပြုသူအမည် ရွေးချယ်ပါ</option>
                        <optgroup label="🏢 Head Office" class="bg-[#151e32] text-slate-400">
                            <option value="admin" class="text-white py-1">Admin</option>
                            <option value="finance" class="text-white py-1">Finance</option>
                        </optgroup>
                        <optgroup label="🏬 ဆိုင်ခွဲ ကောင်တာများ (Branch Cashiers)" class="bg-[#151e32] text-slate-400">
                            <option value="cashier_main" class="text-white py-1">Main Home Shop</option>
                            <option value="cashier_sh1" class="text-white py-1">Shop 1</option>
                            <option value="cashier_sh2" class="text-white py-1">Shop 2</option>
                            <option value="cashier_sh3" class="text-white py-1">Shop 3</option>
                            <option value="cashier_sh4" class="text-white py-1">Shop 4</option>
                        </optgroup>
                    </select>

                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none transition-colors">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </span>
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="login-password" class="block text-xs font-bold text-slate-300 mb-1.5">စကားဝှက် (Password)</label>
                <div class="relative text-slate-400 focus-within:text-emerald-400">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none transition-colors">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••"
                        class="w-full pl-11 pr-11 py-3 text-xs font-bold bg-[#0b0f19] border border-slate-700/80 text-white placeholder-slate-500 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition [&:-webkit-autofill]:[box-shadow:0_0_0px_1000px_#0b0f19_inset] [&:-webkit-autofill]:[-webkit-text-fill-color:#ffffff]" />
                    <button type="button" id="toggle-password" title="စကားဝှက် ကြည့်ရန်/ဖျောက်ရန်" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-white cursor-pointer transition-colors">
                        <i class="fa-regular fa-eye text-sm" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-login-submit"
                class="w-full py-3.5 px-6 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white text-sm font-extrabold rounded-2xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 mt-2 cursor-pointer">
                <span>စနစ်ထဲသို့ ဝင်ရောက်မည်</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- System Footer -->
        <div class="mt-7 pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] font-bold text-slate-400">
            <span class="font-mono">Version 3.0.0</span>
            <span class="flex items-center gap-2 text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Cloudflare D1 Online</span>
            </span>
        </div>
    </div>
</div>
